name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: pwsh
        run: .\build.ps1

      - name: Self-test
        shell: pwsh
        run: |
          $test = Start-Process -FilePath .\dist\WindowMemory.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($test.ExitCode -ne 0) { throw "Self-test failed with exit code $($test.ExitCode)" }

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: WindowMemory-portable
          path: |
            dist/WindowMemory.exe
            dist/portable.flag
            dist/README.md
